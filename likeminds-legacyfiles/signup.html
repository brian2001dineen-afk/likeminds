<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Likeminds - Sign Up</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Personal Css -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Google Fonts (optional fallback if cmu isn't web-embedded yet) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Macondo&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">Likeminds</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navmenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="clubs.html">Clubs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="create.html">Create a Club</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="signup.html">Sign up</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="error.html">Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#faq">FAQ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <div
        class="container vh-100 d-flex flex-column justify-content-center align-items-center text-center"
      >
        <div class="row justify-content-center w-100">
          <div class="col-lg-8 col-md-8">
            <h1 class="fw-bold">Join the Community.</h1>
            <p class="lead mb-4">
              Sign up and gain access to club creation, club sign-up, and future
              side-wide events.
            </p>

            <!-- Email Signup Form -->
            <div class="card border-1 shadow-lg">
              <div class="card-body p-4">
                <form>
                  <div class="mb-3">
                    <label
                      for="signupName"
                      class="form-label fw-bold text-start d-block"
                      >Username <span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <span class="input-group-text"
                        ><i class="fas fa-user"></i
                      ></span>
                      <input
                        type="text"
                        class="form-control"
                        id="signupName"
                        placeholder="Your name"
                      />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label
                      for="signupEmail"
                      class="form-label fw-bold text-start d-block"
                      >Email Address<span class="text-danger">*</span></label
                    >
                    <div class="input-group">
                      <span class="input-group-text"
                        ><i class="fas fa-envelope"></i
                      ></span>
                      <input
                        type="email"
                        class="form-control"
                        id="signupEmail"
                        placeholder="Enter your email address"
                        required
                      />
                    </div>
                  </div>

                  <!-- Submit Buttons -->
                  <button type="submit" class="btn btn-lg frost-btn-dark">
                    Sign up
                  </button>
                </form>
              </div>
            </div>

            <!-- Additional Info -->
            <div class="mt-4">
              <p class="text-muted small">
                <i class="fas fa-shield-alt me-1"></i>
                We respect your privacy. No spam, unsubscribe at any time.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- JavaScript -->
    <script>
      // Back to top functionality
      function scrollToTop() {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }
    </script>
  </body>
</html>
